<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>move_base / TEB 路径可视化</title>
<link rel="stylesheet" href="/static/leaflet.css">
<style>
  html,body{margin:0;padding:0;height:100%;background:#111;color:#ddd;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none;}
  #map{position:absolute;top:0;left:0;width:100%;height:100%;background:#1a1a1a;}
  #ov{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:800;}
  #panel{position:absolute;top:0;left:0;right:0;z-index:1000;background:rgba(0,0,0,.78);
    border-bottom:1px solid #333;padding:8px 10px;font-size:13px;line-height:1.5;
    backdrop-filter:blur(4px);}
  #panel-head{display:flex;align-items:center;gap:10px;margin-top:6px;}
  #chips{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .chip{background:rgba(255,255,255,.06);border-radius:8px;padding:2px 10px;
    font-size:12px;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chip b{color:#fff;font-weight:normal;}
  .legend{display:flex;gap:10px;font-size:12px;margin-top:6px;}
  .legend span::before{content:"";display:inline-block;width:14px;height:3px;margin-right:4px;
    vertical-align:middle;border-radius:2px;}
  .lg-g::before{background:#4caf50;}
  .lg-l::before{background:#ff9800;}
  .lg-t::before{background:#e91e63;}
  #panel-head button{background:rgba(0,0,0,.5);border:1px solid #333;color:#4fc3f7;
    border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer;white-space:nowrap;}
  #b-rec{color:#ff5252!important;}
  #modal-bg{position:absolute;inset:0;z-index:2000;background:rgba(0,0,0,.6);
    display:none;align-items:center;justify-content:center;}
  #modal{background:#1e1e1e;border:1px solid #444;border-radius:12px;padding:16px;
    min-width:240px;max-width:80vw;}
  #modal h4{margin:0 0 12px;color:#4fc3f7;font-size:15px;}
  #modal button{display:block;width:100%;margin:8px 0;padding:10px;border-radius:10px;
    background:rgba(255,255,255,.06);border:1px solid #444;color:#4fc3f7;font-size:14px;
    cursor:pointer;}
  #s-logs{margin-top:6px;height:120px;overflow:auto;border:1px solid #2a2a2a;border-radius:8px;
    background:rgba(0,0,0,.45);padding:4px 8px;font-size:11px;}
  #s-logs .line{white-space:pre;margin-bottom:1px;}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:12px;}
  .legend span::before{content:"";display:inline-block;width:14px;height:3px;margin-right:4px;
    vertical-align:middle;border-radius:2px;}
  .lg-g::before{background:#4caf50;}
  .lg-l::before{background:#ff9800;}
  .lg-t::before{background:#e91e63;}
  #log-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  #log-tags .tagchip{border:1px solid #333;border-radius:10px;padding:1px 10px;
    font-size:11px;cursor:pointer;user-select:none;}
  #btns{position:absolute;bottom:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:1000;}
  #btns button{background:rgba(0,0,0,.75);border:1px solid #444;color:#ddd;border-radius:10px;
    padding:10px 12px;font-size:14px;cursor:pointer;}
  #btns button.on{color:#4fc3f7;border-color:#4fc3f7;}
  #conn{position:absolute;bottom:14px;left:14px;font-size:12px;color:#777;z-index:1000;}
  #leaflet-logo{display:none!important;}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="ov"></canvas>
<div id="panel">
  <div id="chips">
    <span class="chip">状态 <b id="s-status">--</b></span>
    <span class="chip">目标 <b id="s-goal">--</b></span>
    <span class="chip">位姿 <b id="s-pose">--</b></span>
  </div>
  <div class="legend">
    <span class="lg-g">全局路径</span><span class="lg-l">局部路径</span>
    <span class="lg-t">TEB 轨迹</span>
  </div>
  <div id="log-tags"></div>
  <div id="panel-head">
    <button id="b-goal">2D 目标点</button>
    <button id="b-cancel" style="background:rgba(0,0,0,.5);border:1px solid #333;color:#ff9800;
      border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer;white-space:nowrap;">
      ✕ 取消目标</button>
    <button id="b-rec">● 开始录制</button>
    <button id="collapse">收起 ▲</button>
  </div>
  <div id="s-logs"></div>
</div>
<div id="modal-bg">
  <div id="modal">
    <h4>选择导航目标</h4>
    <div id="modal-btns"></div>
    <button id="modal-close" style="color:#999">取消</button>
  </div>
</div>
<div id="btns">
  <button id="b-follow">跟随机器人</button>
  <button id="b-cg">全局costmap</button>
  <button id="b-cl">局部costmap</button>
  <button id="b-center">重置视图</button>
</div>
<div id="conn">等待地图… (v4)</div>
<script src="/static/leaflet.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const DBG = (...a) => console.log('%c[dbg]', 'color:#0af;font-weight:bold', ...a);
console.log('[ros_map_viewer] frontend version: tiles-v4');

// 全局错误捕获：任何未处理异常都会显示在左下角状态栏 + console
window.onerror = (msg, src, line, col, err) => {
  DBG('JS错误:', msg, '@', src + ':' + line + ':' + col, err && err.stack);
  const c = $('conn');
  if (c) c.textContent = 'JS错误: ' + msg;
};
window.addEventListener('unhandledrejection', e => {
  DBG('未处理的Promise错误:', e.reason);
});

// ---------------- Leaflet 初始化（坐标系: 格子, x右 y上） ----------------
const map = L.map('map', {
  crs: L.CRS.Simple, minZoom: -3, maxZoom: 5, zoomSnap: 0.25,
  zoomControl: false, attributionControl: false, inertia: true,
});
map.setView([0, 0], -2);

DBG('Leaflet版本:', L.version, '| 容器尺寸:', map.getSize().toString(), '| L存在:', typeof L !== 'undefined');
setTimeout(() => DBG('100ms后容器尺寸:', map.getSize().toString()), 100);

// 关键事件留档
map.on('layeradd', e => DBG('图层挂载:', e.layer._url || e.layer.getType()));
['zoomstart', 'zoomend'].forEach(ev =>
  map.on(ev, () => DBG('map[' + ev + '] zoom=' + map.getZoom())));

const tileLayers = {};     // name → L.TileLayer
const layerMeta = {};      // name → {res,ox,oy,w,h,ver}
let curVers = {};          // name → 当前已挂载的版本

function makeTileLayer(name, m) {
  // 所有图层的瓦片都在"全局地图网格"坐标系采样，bounds 统一用地图尺寸
  const bm = layerMeta.map || m;
  const tl = L.tileLayer('/tile/' + name + '/{z}/{x}/{y}.png?v=' + m.ver + '_r11', {
    tileSize: 256,
    minZoom: -4,          // 关键修复：必须 ≤ 地图缩放级，否则图层直接不加载任何瓦片
    maxZoom: 6,
    minNativeZoom: 0, maxNativeZoom: 0,
    bounds: [[0, 0], [bm.h, bm.w]], noWrap: true, updateWhenIdle: true, keepBuffer: 1,
  });
  let failed = 0;
  tl.on('tileerror', e => { failed++; DBG(name, 'tile加载失败:', e.tile.src, failed); });
  tl.on('load', () => DBG(name, '视口瓦片就绪'));
  return tl;
}

async function refreshLayout() {
  let lay;
  try {
    const resp = await fetch('/layout');
    lay = await resp.json();
    DBG('/layout 返回:', JSON.stringify(lay));
  } catch (e) { DBG('/layout 请求失败:', e); return; }
  for (const name of ['map', 'cg', 'cl']) {
    const m = lay[name];
    if (!m) { DBG(name, '图层不存在于layout, 跳过'); continue; }
    layerMeta[name] = m;
    if (!tileLayers[name]) {
      // 首次挂载
      curVers[name] = m.ver;
      tileLayers[name] = makeTileLayer(name, m);
      const on = name === 'map' ? true :
        (name === 'cg' ? showCg : showCl);
      DBG(name, '创建tileLayer并挂载:', on);
      if (on) tileLayers[name].addTo(map);
      if (name === 'cg') tileLayers[name].setZIndex(200);
      if (name === 'cl') tileLayers[name].setZIndex(300);
    } else if (curVers[name] !== m.ver) {
      // 内容更新：仅当网格尺寸变化才重建图层；否则原地 redraw 重取瓦片
      // （costmap 瓦片为 no-cache，redraw 即可拿到新内容，无闪烁）
      const sizeChanged = layerMeta[name] &&
        (layerMeta[name].w !== m.w || layerMeta[name].h !== m.h);
      curVers[name] = m.ver;
      layerMeta[name] = m;
      if (sizeChanged) {
        map.removeLayer(tileLayers[name]);
        tileLayers[name] = makeTileLayer(name, m);
        const on = name === 'map' ? true : (name === 'cg' ? showCg : showCl);
        if (on) tileLayers[name].addTo(map);
        if (name === 'cg') tileLayers[name].setZIndex(200);
        if (name === 'cl') tileLayers[name].setZIndex(300);
      } else {
        tileLayers[name].redraw();
      }
    }
    if (name === 'map' && !inited) {
      inited = true;
      DBG('fitBounds 到地图范围, 地图尺寸(格):', m.w, 'x', m.h);
      map.fitBounds([[0, 0], [m.h, m.w]], { animate: false });
      DBG('fitBounds后 zoom:', map.getZoom(), '中心:', map.getCenter().toString());
      $('conn').textContent = '已连接';
    }
  }
}
let inited = false;
let showCg = true, showCl = true;

// ---------------- WebSocket: 路径/位姿/状态 ----------------
let DATA = { global_plan: [], local_plan: [], teb_poses: [], robot: null,
             goal: null, status: {}, pose_src: '--', events: [], rec: {on: false} };
let follow = true;

function connect() {
  DBG('尝试连接WebSocket: ws://' + location.hostname + ':9095/ws');
  const ws = new WebSocket('ws://' + location.hostname + ':9095/ws');
  ws.onopen = () => { DBG('WebSocket已连接'); $('conn').textContent = '已连接'; };
  ws.onerror = e => DBG('WebSocket错误:', e.type);
  ws.onclose = () => { DBG('WebSocket断开, 3s后重连'); $('conn').textContent = '已断开，3s 后重连'; setTimeout(connect, 3000); };
  ws.onmessage = ev => {
    const d = JSON.parse(ev.data);
    DATA = d;
    // 图层版本变化 → 重新拉 layout 并换瓦片源（浏览器缓存让未变的瓦片零传输）
    for (const name of ['map', 'cg', 'cl']) {
      if (d.vers && d.vers[name] !== undefined && d.vers[name] !== curVers[name]) {
        refreshLayout();
        break;
      }
    }
    if (follow && DATA.robot) {
      const [x, y] = DATA.robot;
      const m = layerMeta.map;
      if (m) {
        // 让机器人落在屏幕下三分之一处：中心需在机器人上方 H/6 像素
        const rp = map.project(cellLatlng(x, y, m), map.getZoom());
        const center = map.unproject(rp.subtract([0, innerHeight / 6]), map.getZoom());
        const p = map.getCenter();
        // 与目标偏差超过 5 格才动，减少 setView 风暴
        if (Math.abs(center.lat - p.lat) > 5 || Math.abs(center.lng - p.lng) > 5)
          map.setView(center, map.getZoom(), { animate: false });
      }
    }
    updateUI();
    updateRecBtn();
    drawOverlay();
  };
}

// ---------------- 覆盖层 canvas 绘制 ----------------
const ov = $('ov'), octx = ov.getContext('2d');

function cellLatlng(wx, wy, m) {
  return L.latLng((wy - m.oy) / m.res, (wx - m.ox) / m.res);
}
function w2c(wx, wy, m) {  // world → container px
  const p = map.latLngToContainerPoint(cellLatlng(wx, wy, m));
  return [p.x, p.y];
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  ov.width = innerWidth * dpr; ov.height = innerHeight * dpr;
  ov.style.width = innerWidth + 'px'; ov.style.height = innerHeight + 'px';
  drawOverlay();
}
window.addEventListener('resize', resize);
map.on('move zoom viewreset', drawOverlay);

function drawOverlay() {
  const dpr = window.devicePixelRatio || 1;
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.clearRect(0, 0, innerWidth, innerHeight);
  const m = layerMeta.map;
  if (!m) return;

  drawPath(DATA.global_plan, '#4caf50', 2);
  drawPath(DATA.local_plan, '#ff9800', 2);
  drawPath(DATA.teb_poses, '#e91e63', 1.5);

  // 目标点箭头预览
  if (goalMode && goalPreview) {
    const [ax, ay, bx, by] = goalPreview;
    const [x0, y0] = w2c(ax, ay, m);
    const [x1, y1] = w2c(bx, by, m);
    octx.beginPath(); octx.moveTo(x0, y0); octx.lineTo(x1, y1);
    octx.strokeStyle = '#f44336'; octx.lineWidth = 2.5; octx.stroke();
    const ang = Math.atan2(y1 - y0, x1 - x0), hl = 12;
    octx.beginPath(); octx.moveTo(x1, y1);
    octx.lineTo(x1 - hl * Math.cos(ang - 0.45), y1 - hl * Math.sin(ang - 0.45));
    octx.lineTo(x1 - hl * Math.cos(ang + 0.45), y1 - hl * Math.sin(ang + 0.45));
    octx.closePath(); octx.fillStyle = '#f44336'; octx.fill();
    // 起点圆
    octx.beginPath(); octx.arc(x0, y0, 5, 0, Math.PI * 2);
    octx.fillStyle = '#f44336'; octx.fill();
  }

  if (DATA.robot) {
    const [x, y, th] = DATA.robot;
    const [sx, sy] = w2c(x, y, m);
    const r = 12;  // 固定像素大小，不随地图缩放变化
    octx.save(); octx.translate(sx, sy); octx.rotate(-th);
    octx.beginPath(); octx.moveTo(r * 1.6, 0);
    octx.lineTo(-r, r * 0.8); octx.lineTo(-r, -r * 0.8); octx.closePath();
    octx.fillStyle = '#2196f3'; octx.fill();
    octx.strokeStyle = '#fff'; octx.lineWidth = 1.5; octx.stroke();
    octx.restore();
  }
  if (DATA.goal) {
    const [gx, gy, gyaw] = DATA.goal;
    const [sx, sy] = w2c(gx, gy, m);
    const ga = -(gyaw || 0), L = 22;   // 方向线长度(像素)
    octx.beginPath(); octx.arc(sx, sy, 6, 0, Math.PI * 2);
    octx.strokeStyle = '#f44336'; octx.lineWidth = 2.5; octx.stroke();
    // 方向箭头
    const ex = sx + L * Math.cos(ga), ey = sy + L * Math.sin(ga);
    octx.beginPath(); octx.moveTo(sx, sy); octx.lineTo(ex, ey);
    octx.strokeStyle = '#f44336'; octx.lineWidth = 2.5; octx.stroke();
    const hl = 9;
    octx.beginPath(); octx.moveTo(ex, ey);
    octx.lineTo(ex - hl * Math.cos(ga - 0.45), ey - hl * Math.sin(ga - 0.45));
    octx.lineTo(ex - hl * Math.cos(ga + 0.45), ey - hl * Math.sin(ga + 0.45));
    octx.closePath(); octx.fillStyle = '#f44336'; octx.fill();
  }
  // 比例尺：从候选长度中选一个像素宽度在 40~160 之间的
  const p1 = map.latLngToContainerPoint([0, 0]);
  const p2 = map.latLngToContainerPoint([0, 1]);
  const pxPerCell = Math.abs(p2.x - p1.x);
  const res = m.res;
  const cand = [0.5, 1, 2, 5, 10, 20, 50, 100];
  let bar = 100, mLen = 10;
  for (const c of cand) {
    const px = c / res * pxPerCell;
    if (px >= 40 && px <= 160) { bar = px; mLen = c; break; }
    if (px > 160) { bar = px; mLen = c; break; }
  }
  octx.fillStyle = '#aaa'; octx.font = '11px sans-serif';
  const bx = 14, by = innerHeight - 34;
  octx.fillRect(bx, by, bar, 2);
  octx.fillText(mLen + ' m', bx, by - 6);
}

function drawPath(pts, color, lw) {
  if (!pts || pts.length < 2) return;
  const m = layerMeta.map;
  octx.beginPath();
  let [px, py] = w2c(pts[0][0], pts[0][1], m);
  octx.moveTo(px, py);
  for (let i = 1; i < pts.length; i++) {
    [px, py] = w2c(pts[i][0], pts[i][1], m);
    octx.lineTo(px, py);
  }
  octx.strokeStyle = color; octx.lineWidth = lw; octx.lineJoin = 'round'; octx.stroke();
}

// ---------------- UI ----------------
function fmtPos(v) { return typeof v === 'number' ? v.toFixed(2) : '--'; }

function updateUI() {
  const st = DATA.status || {};
  $('s-status').textContent = st.text || '--';
  $('s-status').style.background =
    st.code === 3 ? '#2e7d32' : st.code === 4 ? '#c62828' :
    st.code === 1 ? '#1565c0' : '#555';
  $('s-goal').textContent = DATA.goal ?
    '(' + DATA.goal[0].toFixed(2) + ', ' + DATA.goal[1].toFixed(2) + ')' : '--';
  $('s-pose').textContent = DATA.robot ?
    '(' + DATA.robot[0].toFixed(2) + ', ' + DATA.robot[1].toFixed(2) +
    ', ' + (DATA.robot[2] * 57.3).toFixed(0) + '°)' : '--';
  // 日志区：move_base 事件 + rosout WARN/ERROR（最新在上，双向滚动，按来源开关过滤）
  const logs = $('s-logs');
  const evs = DATA.events || [];
  // 收集出现过的来源 tag：mb=move_base事件, rosout 取节点首段
  const tags = {};
  for (const e of evs) {
    const t = e.kind === 'rosout' ? (e.source || 'rosout').replace(/^\//, '').split('/')[0] : 'mb';
    e.tag = t;
    tags[t] = true;
  }
  for (const t of Object.keys(tags))
    if (!(t in logTagFilter)) logTagFilter[t] = true;
  renderLogTags(Object.keys(logTagFilter).sort());
  const shown = evs.filter(e => logTagFilter[e.tag] !== false);
  if (shown.length) {
    logs.innerHTML = shown.map(e =>
      '<div class="line" style="color:' + e.color + '">' +
      '<span style="color:#666">' + e.t + '</span> ' + e.text + '</div>').join('');
  } else {
    logs.innerHTML = '<div class="line" style="color:#666">暂无日志</div>';
  }
}

// 来源开关 UI
let logTagFilter = {};
function renderLogTags(tagList) {
  const row = $('log-tags');
  if (!row) return;
  row.innerHTML = tagList.map(t => {
    const on = logTagFilter[t] !== false;
    return '<span class="tagchip" data-t="' + t + '" style="' +
      (on ? 'color:#4fc3f7;border-color:#4fc3f7' : 'color:#666;border-color:#333;text-decoration:line-through') +
      '">' + (t === 'mb' ? 'move_base事件' : t) + '</span>';
  }).join('');
  row.querySelectorAll('.tagchip').forEach(el => {
    el.onclick = () => {
      const t = el.dataset.t;
      logTagFilter[t] = logTagFilter[t] === false ? true : false;
      renderLogTags(tagList);
      // 触发重绘日志
      if (DATA) updateUI();
    };
  });
}

function updateBtns() {
  $('b-follow').classList.toggle('on', follow);
  $('b-cg').classList.toggle('on', showCg);
  $('b-cl').classList.toggle('on', showCl);
}

$('b-follow').onclick = () => { follow = !follow; updateBtns(); };
$('b-cg').onclick = () => { showCg = !showCg; updateBtns(); toggleLayer('cg', showCg); };
$('b-cl').onclick = () => { showCl = !showCl; updateBtns(); toggleLayer('cl', showCl); };
$('b-center').onclick = () => {
  follow = false; updateBtns();
  const m = layerMeta.map;
  if (m) map.fitBounds([[0, 0], [m.h, m.w]]);
};
// ---- 2D 目标点（RViz 2D Nav Goal 同款）：按下→拖动画箭头→松开发送 ----
let goalMode = false;
let goalDrag = null;   // {startLatlng, endLatlng}
let goalPreview = null;

function exitGoalMode() {
  goalMode = false; goalDrag = null; goalPreview = null;
  map.dragging.enable();
  $('b-goal').classList.remove('on');
  ov.style.cursor = 'grab';
  drawOverlay();
}
function w2world(latlng) {
  const m = layerMeta.map;
  return [m.ox + latlng.lng * m.res, m.oy + latlng.lat * m.res];
}

$('b-goal').onclick = () => {
  goalMode = !goalMode;
  if (goalMode) {
    follow = false; updateBtns();
    map.dragging.disable();               // 目标模式下禁用地图拖拽
    ov.style.cursor = 'crosshair';
    $('b-goal').classList.add('on');
  } else exitGoalMode();
};

// 用 map 容器的原生鼠标/触摸事件画箭头（Leaflet dragging 已禁用，不冲突）
const mapEl = map.getContainer();
function goalEvt(e) {
  const rect = mapEl.getBoundingClientRect();
  return map.mouseEventToLatLng({ clientX: e.clientX - rect.left,
                                  clientY: e.clientY - rect.top });
}
mapEl.addEventListener('mousedown', e => {
  if (!goalMode || e.button !== 0) return;
  goalDrag = { start: goalEvt(e) };
  e.preventDefault();
});
mapEl.addEventListener('mousemove', e => {
  if (!goalMode || !goalDrag) return;
  goalDrag.end = goalEvt(e);
  const m = layerMeta.map;
  if (!m) return;
  const [wx0, wy0] = w2world(goalDrag.start);
  const [wx1, wy1] = w2world(goalDrag.end);
  goalPreview = [wx0, wy0, wx1, wy1];
  drawOverlay();
});
mapEl.addEventListener('mouseup', e => {
  if (!goalMode || !goalDrag) return;
  const end = goalEvt(e);
  const m = layerMeta.map;
  const [wx0, wy0] = w2world(goalDrag.start);
  const [wx1, wy1] = w2world(end);
  goalDrag = null; goalPreview = null;
  exitGoalMode();
  if (!m) return;
  const yaw = Math.atan2(wy1 - wy0, wx1 - wx0);   // 拖动方向 → 朝向
  fetch('/navgoal?x=' + wx0.toFixed(3) + '&y=' + wy0.toFixed(3) +
        '&yaw=' + yaw.toFixed(3))
    .then(r => r.json())
    .then(r => { if (!r.ok) alert('发送失败: ' + r.err); })
    .catch(e => alert('请求失败: ' + e));
});
// 触摸支持（移动端）
mapEl.addEventListener('touchstart', e => {
  if (!goalMode || e.touches.length !== 1) return;
  goalDrag = { start: goalEvt(e.touches[0]) };
  e.preventDefault();
}, { passive: false });
mapEl.addEventListener('touchmove', e => {
  if (!goalMode || !goalDrag) return;
  goalDrag.end = goalEvt(e.touches[0]);
  const m = layerMeta.map;
  if (!m) return;
  const [wx0, wy0] = w2world(goalDrag.start);
  const [wx1, wy1] = w2world(goalDrag.end);
  goalPreview = [wx0, wy0, wx1, wy1];
  drawOverlay();
  e.preventDefault();
}, { passive: false });
mapEl.addEventListener('touchend', e => {
  if (!goalMode || !goalDrag) return;
  const [wx0, wy0] = w2world(goalDrag.start);
  const end = goalDrag.end || goalDrag.start;
  const [wx1, wy1] = w2world(end);
  goalDrag = null; goalPreview = null;
  exitGoalMode();
  const yaw = Math.atan2(wy1 - wy0, wx1 - wx0);
  fetch('/navgoal?x=' + wx0.toFixed(3) + '&y=' + wy0.toFixed(3) +
        '&yaw=' + yaw.toFixed(3))
    .then(r => r.json())
    .then(r => { if (!r.ok) alert('发送失败: ' + r.err); })
    .catch(e => alert('请求失败: ' + e));
});

$('b-cancel').onclick = async () => {
  try {
    const r = await (await fetch('/navgoal/cancel')).json();
    if (!r.ok) alert('取消失败: ' + r.err);
  } catch (e) { alert('请求失败: ' + e); }
};

let panelCollapsed = false;
let recBusy = false;
$('b-rec').onclick = async () => {
  if (recBusy) return;
  recBusy = true;
  try {
    const act = DATA.rec && DATA.rec.on ? 'stop' : 'start';
    const r = await (await fetch('/record/' + act)).json();
    if (!r.ok) alert('录制操作失败: ' + r.err);
  } catch (e) { alert('请求失败: ' + e); }
  recBusy = false;
};
// 导航点 modal：从 /navpoints 动态加载（scripts/ 目录下的 .sh）
let navList = [];
async function loadNavBtns() {
  try { navList = await (await fetch('/navpoints')).json(); } catch (e) {}
  const box = $('modal-btns');
  box.innerHTML = '';
  if (!navList.length) {
    box.innerHTML = '<div style="color:#999;font-size:13px;padding:8px">暂无可用脚本</div>';
  }
  for (const s of navList) {
    const b = document.createElement('button');
    b.textContent = '▶ ' + s.name;
    b.onclick = async () => {
      closeModal();
      try { await fetch('/navpoint/' + s.id); } catch (e) { alert('请求失败: ' + e); }
    };
    box.appendChild(b);
  }
}
function openModal() { $('modal-bg').style.display = 'flex'; }
function closeModal() { $('modal-bg').style.display = 'none'; }
$('modal-close').onclick = closeModal;
$('modal-bg').onclick = e => { if (e.target === $('modal-bg')) closeModal(); };

function updateRecBtn() {
  const on = DATA.rec && DATA.rec.on;
  const b = $('b-rec');
  b.textContent = on ? '■ 结束录制' : '● 开始录制';
  b.style.borderColor = on ? '#ff5252' : '#333';
  b.style.color = on ? '#fff' : '#ff5252';
  b.style.background = on ? 'rgba(198,40,40,.6)' : 'rgba(0,0,0,.5)';
}
$('collapse').onclick = () => {
  panelCollapsed = !panelCollapsed;
  $('s-logs').style.display = panelCollapsed ? 'none' : '';
  document.querySelector('.legend').style.display = panelCollapsed ? 'none' : '';
  $('collapse').textContent = panelCollapsed ? '展开 ▼' : '收起 ▲';
};

function toggleLayer(name, on) {
  if (!tileLayers[name]) return;
  if (on) { tileLayers[name].addTo(map); tileLayers[name].setZIndex(name === 'cg' ? 200 : 300); }
  else map.removeLayer(tileLayers[name]);
}

// ---------------- 启动 ----------------
updateBtns();
resize();
setTimeout(() => map.invalidateSize(), 100);  // 容器尺寸变化后强制重算
refreshLayout();
loadNavBtns();
setInterval(refreshLayout, 3000);  // 兜底轮询（WS 断连时也能恢复图层）
connect();
</script>
</body>
</html>
